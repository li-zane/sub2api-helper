name: Check

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.os }} (${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    concurrency:
      group: helper-check-${{ github.event.pull_request.number || github.ref }}-${{ matrix.os }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Check release tooling
        if: matrix.shard == 1
        run: python -m unittest discover -s .agents/release -p 'test_*.py' -v
      - name: Check source and credential storage
        run: npm run check:ci -- --shard ${{ matrix.shard }}/4 --timings "${{ runner.temp }}/ci-timings.json"
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-timings-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-timings.json
          if-no-files-found: warn
          retention-days: 14
      - name: Audit dependencies
        if: matrix.shard == 1
        run: npm run audit:dependencies
      - name: Package Linux runtime
        if: runner.os == 'Linux' && matrix.shard == 1 && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python .agents/release/bundle.py --output release-dist --revision "$GITHUB_SHA"
      - name: Upload runtime bundle
        if: runner.os == 'Linux' && matrix.shard == 1 && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: helper-linux-runtime
          path: |
            release-dist/helper-linux-x64-node22.tar.gz
            release-dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish runtime release
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: helper-runtime-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: helper-linux-runtime
          path: release-dist
      - name: Publish immutable commit bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="helper-$GITHUB_SHA"
          if gh release view "$tag" --json targetCommitish,assets > existing-release.json 2>/dev/null; then
            python3 - <<'PY'
          import json, os
          release = json.load(open('existing-release.json'))
          assert release['targetCommitish'] == os.environ['GITHUB_SHA']
          assert {'helper-linux-x64-node22.tar.gz', 'SHA256SUMS'} <= {a['name'] for a in release['assets']}
          print('Existing immutable release retained')
          PY
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Helper ${GITHUB_SHA:0:12}" \
            --notes "Linux x64 / Node 22 runtime bundle for commit $GITHUB_SHA. Includes built frontend and Node dependencies; x3 performs no npm install or frontend build." \
            --latest=false release-dist/helper-linux-x64-node22.tar.gz release-dist/SHA256SUMS

      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ $version =~ ^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})$ ]]
          tag="v$version"
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "Retaining the existing $tag. Bump package.json to publish another stable version."
            exit 0
          fi
          # An overtaken CI run must not publish an older head as the stable channel.
          [[ $(gh api "repos/$GH_REPO/commits/main" --jq .sha) == "$GITHUB_SHA" ]] || exit 0
          if ref=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            [[ $ref == "$GITHUB_SHA" ]]
          fi
          notes="docs/releases/$tag.md"
          if [[ ! -f $notes ]]; then printf '%s\n' "Sub2api Helper $tag. Verified Linux x64 / Node 22 runtime for $GITHUB_SHA." > release-dist/notes.md; notes=release-dist/notes.md; fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Sub2api Helper $tag" --notes-file "$notes" --latest=true \
            release-dist/helper-linux-x64-node22.tar.gz release-dist/SHA256SUMS
